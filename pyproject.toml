[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stripe-idempotent-payments-demo"
version = "0.1.0"
description = "FastAPI application for idempotent Stripe payments with MCP integration"
requires-python = ">=3.12"
authors = [{name = "Developer", email = "dev@example.com"}]
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic-settings>=2.1.0",
    "stripe>=7.0.0",
    "sqlalchemy>=2.0.0",
    "fastapi-mcp>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "alembic>=1.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", ".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

